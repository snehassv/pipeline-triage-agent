<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Pipeline Triage</title>
<!-- Same mark as the header logo: a small DAG whose last node has failed. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f5bd5'/%3E%3Cstop offset='1' stop-color='%237b3fe4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M9 16 22.5 9.5M9 16l13.5 6.5' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='16' r='3.6' fill='%23fff'/%3E%3Ccircle cx='22.5' cy='9.5' r='3.6' fill='%23fff'/%3E%3Ccircle cx='22.5' cy='22.5' r='4.2' fill='%23ff4d5e' stroke='%23fff' stroke-width='1.8'/%3E%3C/svg%3E">
<!-- agent-config -->
<style>
  :root {
    --bg: #eef0f4;
    --surface: #ffffff;
    --surface-2: #f4f5f8;
    --border: #e1e4ea;
    --text: #161a22;
    --muted: #677084;
    --faint: #9aa1b0;
    --accent: #4f5bd5;
    --accent-2: #7b3fe4;
    --accent-soft: #eceefd;
    --head: #12151c;
    --head-2: #1d212b;
    --head-text: #eef0f5;
    --head-muted: #8e96a8;
    --err: #d03347;
    --err-bg: #fdecef;
    --warn: #9a6a12;
    --warn-bg: #fdf4e1;
    --ok: #1d7f4f;
    --ok-bg: #e4f5eb;
    --code-bg: #12151c;
    --code-text: #d7dbe3;
    --code-err: #ff8b96;
    --code-warn: #e9c46a;
    --code-info: #8a93a6;
    --diff-add-bg: #e6f6ec;
    --diff-add: #196c40;
    --diff-del-bg: #fdebed;
    --diff-del: #a42a36;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
    --overlay: rgba(15, 20, 30, .45);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); }
  button, input, select { font: inherit; color: inherit; }
  a { color: var(--accent); }
  .mono { font-family: var(--mono); }

  /* ---------- header bar ---------- */
  header {
    display: flex; align-items: center; flex-wrap: wrap; gap: 14px 22px;
    padding: 14px 28px; background: var(--head); color: var(--head-text);
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand svg { width: 38px; height: 38px; flex: none; display: block; }
  .brand h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.2px; }
  .brand p { margin: 0; font-size: 12px; color: var(--head-muted); }
  .divider { width: 1px; align-self: stretch; background: #2b303c; }
  .range {
    display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 10px;
    background: var(--head-2);
  }
  .range input {
    height: 30px; border: 0; background: transparent; color: var(--head-text);
    color-scheme: dark; padding: 0 4px; font-variant-numeric: tabular-nums;
  }
  .range .arrow { color: var(--head-muted); }
  .spacer { flex: 1; }
  .explain { display: flex; align-items: center; gap: 10px; }
  .explain .label { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--head-muted); }
  .seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--head-2); }
  .seg button {
    border: 0; background: transparent; color: var(--head-muted); cursor: pointer;
    padding: 5px 14px; border-radius: 7px; font-weight: 600;
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .seg button:focus-visible { outline: 2px solid #a9b1ff; outline-offset: 1px; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--head-muted); }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .status.live { color: #5fd39a; }
  .status.offline { color: #ff7b86; }

  /* ---------- toolbar ---------- */
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 14px 28px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .search { position: relative; flex: 1 1 260px; max-width: 420px; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); }
  .toolbar .search input { width: 100%; padding-left: 36px; }
  .toolbar input, .toolbar select {
    height: 38px; padding: 0 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
  }
  .toolbar select { padding-right: 8px; }
  .btn {
    height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); cursor: pointer; font-weight: 600; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: #4350c6; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------- page ---------- */
  .page { padding: 26px 28px 48px; max-width: 1560px; margin: 0 auto; }
  .banner { margin-bottom: 16px; padding: 10px 14px; border-radius: 10px; background: var(--err-bg); color: var(--err); font-weight: 500; }
  .title-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; }
  .title-row h2 { margin: 0; font-size: 24px; letter-spacing: -.4px; }
  .title-row .count { font-size: 16px; color: var(--muted); }
  .subline { margin: 4px 0 18px; color: var(--muted); font-size: 13.5px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; box-shadow: var(--shadow); }
  .stat .v { font-size: 22px; font-weight: 700; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 12.5px; color: var(--muted); }
  .stat.ready .v { color: var(--ok); }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
  .layout.open { grid-template-columns: minmax(0, 1fr) minmax(420px, 560px); }

  /* ---------- failure list: each row is a card ---------- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: separate; border-spacing: 0 8px; margin-top: -8px; }
  th {
    text-align: left; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); padding: 6px 14px 0; white-space: nowrap;
  }
  th button { all: unset; cursor: pointer; }
  th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  th .sort-arrow { margin-left: 4px; }
  tbody td {
    background: var(--surface); padding: 14px; vertical-align: middle;
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  }
  tbody td:first-child { border-left: 1px solid var(--border); border-radius: 12px 0 0 12px; width: 36px; padding-right: 0; }
  tbody td:last-child { border-right: 1px solid var(--border); border-radius: 0 12px 12px 0; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: #fafbff; }
  tbody tr.active td { background: var(--accent-soft); border-color: #c9cef8; }
  tbody tr:focus-visible { outline: none; }
  tbody tr:focus-visible td { border-color: var(--accent); }
  .dot { display: block; width: 9px; height: 9px; border-radius: 50%; background: var(--err); margin-left: 6px; }
  .dag { font-family: var(--mono); font-size: 14.5px; font-weight: 600; overflow-wrap: anywhere; }
  td.col-main { min-width: 250px; }
  td.col-type { width: 1%; }
  td.col-conf { white-space: nowrap; }
  td.col-type .badge { white-space: normal; display: inline-block; width: max-content; max-width: 220px; line-height: 1.35; }
  .task { font-family: var(--mono); font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .task::before { content: "↳ "; }
  .err-line {
    margin-top: 4px; font-family: var(--mono); font-size: 12px; color: var(--err);
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word;
  }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .when { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .empty { padding: 56px 20px; text-align: center; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  .empty strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }

  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 8px; font-size: 12.5px; font-weight: 600; white-space: nowrap;
    background: var(--surface-2); color: var(--muted);
  }
  .cat-schema { background: #efeafe; color: #6a3fd1; }
  .cat-merge  { background: #fde9ef; color: #c0305a; }
  .cat-dq     { background: #e5f6ec; color: #1d7f4f; }
  .cat-sensor { background: #e6f0fd; color: #2c62b8; }
  .cat-table  { background: #fdecec; color: #c23a3a; }
  .cat-gcs    { background: #fdf3e0; color: #a3690f; }
  .cat-auth   { background: #eef1f4; color: #54607a; }
  .conf-High   { background: var(--ok-bg); color: var(--ok); }
  .conf-Medium { background: var(--warn-bg); color: var(--warn); }
  .conf-Low    { background: var(--err-bg); color: var(--err); }
  .chip {
    display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
    border: 1px solid var(--border); color: var(--muted); background: var(--surface);
  }
  .chip.env { font-family: var(--mono); }
  .chip.ready { border-color: #9fd9b9; color: var(--ok); background: #f3fbf6; margin-left: 6px; }
  .badge.pending { background: var(--accent-soft); color: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .badge.pending { animation: none; } }
  .none { color: var(--faint); }

  /* ---------- detail panel ---------- */
  .panel {
    position: sticky; top: 16px; max-height: calc(100vh - 32px); display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden;
  }
  .panel-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--border); }
  .panel-title { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
  .icon-btn {
    border: 0; background: transparent; cursor: pointer; width: 30px; height: 30px; border-radius: 8px;
    color: var(--muted); font-size: 20px; line-height: 1; flex: none;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .meta b { color: var(--text); font-weight: 600; }
  .panel-body { padding: 4px 20px 20px; overflow-y: auto; flex: 1; }
  .section { margin-top: 20px; }
  .section h3 {
    margin: 0 0 8px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  }
  .section h3 .aud { text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--faint); }
  .log {
    margin: 0; padding: 12px 14px; border-radius: 10px; background: var(--code-bg); color: var(--code-text);
    font: 12px/1.55 var(--mono); overflow-x: auto; white-space: pre-wrap; word-break: break-word;
  }
  .log .err { color: var(--code-err); }
  .log .warn { color: var(--code-warn); }
  .log .info { color: var(--code-info); }
  .diag-type { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
  .diag-type strong { font-size: 16px; }
  .cause { margin: 0; line-height: 1.6; }
  .impact { margin: 10px 0 0; padding: 8px 12px; border-left: 3px solid var(--warn); background: var(--warn-bg); border-radius: 0 8px 8px 0; font-size: 13px; }
  .usage { margin-top: 10px; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .notice { padding: 12px 14px; border-radius: 10px; background: var(--surface-2); color: var(--muted); font-size: 13px; }
  .notice .mono { color: var(--err); display: block; margin-top: 6px; word-break: break-word; }
  .file { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 6px 0 8px; }
  .diff { margin-top: 8px; border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; font: 12px/1.6 var(--mono); }
  .diff div { padding: 0 12px; white-space: pre; }
  .diff .add { background: var(--diff-add-bg); color: var(--diff-add); }
  .diff .del { background: var(--diff-del-bg); color: var(--diff-del); }
  .diff .ctx { color: var(--muted); }
  .diff .file { margin: 0; background: var(--surface-2); color: var(--text); font-weight: 600; padding-top: 4px; padding-bottom: 4px; }
  .diff .hunk { color: var(--faint); background: var(--surface-2); }
  .patch-warn { margin-top: 8px; padding: 8px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); font-size: 12.5px; }
  .chip.root { margin-left: 2px; }
  .chip.root-data, .chip.root-environment { border-color: #f1cf8f; color: var(--warn); background: #fffaf0; }
  .withheld { margin-top: 8px; padding: 8px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); font-size: 12.5px; }
  .diff.muted { opacity: .7; }
  .patch-warn .mono { display: block; margin-top: 4px; font-size: 11.5px; white-space: pre-wrap; word-break: break-word; }
  .panel-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .panel-foot .why { font-size: 12.5px; color: var(--muted); }
  .pr-done { font-size: 13px; color: var(--ok); font-weight: 600; }

  /* ---------- modal ---------- */
  .modal-bg { position: fixed; inset: 0; background: var(--overlay); display: none; place-items: center; padding: 16px; z-index: 50; }
  .modal-bg.show { display: grid; }
  .modal { width: min(480px, 100%); background: var(--surface); border-radius: 14px; border: 1px solid var(--border); padding: 22px; }
  .modal h2 { margin: 0 0 6px; font-size: 17px; }
  .modal p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .modal dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0 0 18px; font-size: 13px; }
  .modal dt { color: var(--muted); }
  .modal dd { margin: 0; font-family: var(--mono); font-size: 12px; word-break: break-all; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .modal .error { color: var(--err); font-size: 13px; margin: -6px 0 14px; }

  /* ---------- responsive ---------- */
  @media (max-width: 1180px) { .explain .label { display: none; } }
  /* Panel open on a mid-size screen: keep the DAG and its confidence, drop the rest. */
  @media (max-width: 1360px) {
    .layout.open .col-type, .layout.open .col-env, .layout.open .col-when, .layout.open .col-runs { display: none; }
    .layout.open { grid-template-columns: minmax(0, 1fr) minmax(380px, 480px); }
    .layout.open td.col-conf { border-right: 1px solid var(--border); border-radius: 0 12px 12px 0; }
  }
  @media (max-width: 1000px) {
    .divider, .spacer { display: none; }
    .layout.open { grid-template-columns: minmax(0, 1fr); }
    .panel { position: fixed; inset: 0; max-height: none; border-radius: 0; z-index: 40; }
    .col-env, .col-when, .col-runs { display: none; }
    td.col-conf { border-right: 1px solid var(--border); border-radius: 0 12px 12px 0; }
  }
  @media (max-width: 640px) {
    header, .toolbar, .page { padding-left: 16px; padding-right: 16px; }
    .col-type { display: none; }
    tbody td { padding: 12px 10px; }
    .search { max-width: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <defs>
        <linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#4f5bd5"/><stop offset="1" stop-color="#7b3fe4"/>
        </linearGradient>
      </defs>
      <rect width="32" height="32" rx="8" fill="url(#logo-g)"/>
      <path d="M9 16 22.5 9.5M9 16l13.5 6.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="9" cy="16" r="3.6" fill="#fff"/>
      <circle cx="22.5" cy="9.5" r="3.6" fill="#fff"/>
      <circle cx="22.5" cy="22.5" r="4.2" fill="#ff4d5e" stroke="#fff" stroke-width="1.8"/>
    </svg>
    <div>
      <h1>Pipeline Triage</h1>
      <p id="subtitle">Airflow</p>
    </div>
  </div>
  <div class="divider"></div>
  <div class="range" role="group" aria-label="Date range">
    <input type="date" id="start" aria-label="From">
    <span class="arrow" aria-hidden="true">→</span>
    <input type="date" id="end" aria-label="To">
  </div>
  <div class="spacer"></div>
  <div class="explain">
    <span class="label" id="explain-label">EXPLAIN FOR</span>
    <div class="seg" role="group" aria-labelledby="explain-label">
      <button type="button" data-audience="analyst">Analyst</button>
      <button type="button" data-audience="engineer">Engineer</button>
    </div>
  </div>
  <span id="status" class="status">Connecting…</span>
</header>

<div class="toolbar">
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/>
      <path d="m11 11 3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <input id="q" type="search" placeholder="Filter by DAG, task or error…" aria-label="Search">
  </div>
  <select id="cat" aria-label="Failure type"><option value="">All failure types</option></select>
  <select id="conf" aria-label="Confidence">
    <option value="">Any confidence</option>
    <option value="ready">PR ready</option>
    <option value="High">High</option>
    <option value="Medium">Medium</option>
    <option value="Low">Low</option>
    <option value="none">Not diagnosed</option>
  </select>
  <button class="btn" id="refresh" type="button">Refresh</button>
</div>

<div class="page">
  <div id="banner" class="banner" role="alert" hidden></div>

  <div class="title-row">
    <h2>Failed tasks</h2>
    <span class="count" id="count"></span>
  </div>
  <p class="subline" id="subline">&nbsp;</p>

  <div class="stats">
    <div class="stat"><div class="v" id="s-tasks">–</div><div class="l">Failing tasks</div></div>
    <div class="stat"><div class="v" id="s-runs">–</div><div class="l">Failed runs</div></div>
    <div class="stat"><div class="v" id="s-diag">–</div><div class="l" id="s-diag-l">Diagnosed</div></div>
    <div class="stat ready"><div class="v" id="s-ready">–</div><div class="l">PR ready</div></div>
  </div>

  <div id="layout" class="layout">
    <div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th aria-label="Status"></th>
              <th><button type="button" data-sort="dag">DAG / failed task<span class="sort-arrow"></span></button></th>
              <th class="col-type">Failure type</th>
              <th><button type="button" data-sort="conf">Confidence<span class="sort-arrow"></span></button></th>
              <th class="col-env">Env</th>
              <th class="col-when"><button type="button" data-sort="when" id="when-h">When<span class="sort-arrow"></span></button></th>
              <th class="col-runs num"><button type="button" data-sort="runs">Runs<span class="sort-arrow"></span></button></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="empty" class="empty" hidden></div>
    </div>
    <aside id="panel" class="panel" hidden aria-label="Failure details"></aside>
  </div>
</div>

<div id="modal-bg" class="modal-bg" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal" id="modal"></div>
</div>

<script>
(() => {
  "use strict";

  // Injected by the agent at serve time (see agent/main.py). Opening this file from disk
  // leaves it undefined, and the page says so instead of silently failing.
  const CFG = window.__AGENT_CONFIG || null;
  const POLL_MS = 30000;
  const PENDING_POLL_MS = 3000;   // while diagnoses are running in the background
  let pendingTimer = null;
  const CATEGORIES = {
    schema: "Schema", merge: "Merge", dq: "Data quality", sensor: "Sensor",
    table: "Table", gcs: "File / export", auth: "Auth",
  };
  const CONF_RANK = { High: 3, Medium: 2, Low: 1 };
  const ROOT_LABEL = { code: "code", config: "config", data: "data", environment: "environment" };
  const PATCHABLE = new Set(["code", "config"]);

  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const store = {
    get(k, d) { try { return localStorage.getItem(k) || d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode */ } },
  };

  const state = {
    failures: [],
    selectedId: null,
    audience: store.get("triage.audience", "engineer"),
    sort: { key: "when", dir: -1 },
    prResults: {},        // failure id -> {number, url}
    loading: false,
    lastSync: null,
  };

  const tz = (CFG && CFG.timezone) || Intl.DateTimeFormat().resolvedOptions().timeZone;
  const today = () => new Intl.DateTimeFormat("en-CA", { timeZone: tz }).format(new Date());
  const tzAbbr = (() => {
    const part = new Intl.DateTimeFormat("en-US", { timeZone: tz, timeZoneName: "short" })
      .formatToParts(new Date()).find((p) => p.type === "timeZoneName");
    return part ? part.value : "";
  })();

  // ------------------------------------------------------------------ data
  async function load() {
    if (!CFG) {
      setStatus("offline", "Not connected");
      showBanner("Open this dashboard through the agent (uvicorn agent.main:app --port 8787, then http://localhost:8787) — opened from disk it has no API token.");
      render();
      return;
    }
    if (state.loading) return;
    state.loading = true;
    $("refresh").disabled = true;
    const qs = new URLSearchParams({ start: $("start").value, end: $("end").value });
    try {
      const res = await fetch("/failures?" + qs, { headers: { "X-Agent-Token": CFG.token } });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.detail || `agent returned ${res.status}`);
      state.failures = Array.isArray(body) ? body : body.failures || [];
      state.lastSync = new Date();
      hideBanner();
      setStatus("live", "Live · Airflow");
      if (state.selectedId && !state.failures.some((f) => f.id === state.selectedId)) state.selectedId = null;
    } catch (err) {
      const offline = err instanceof TypeError;   // fetch() itself failed: agent not running
      setStatus("offline", offline ? "Agent offline" : "Error");
      showBanner(offline ? "Can't reach the agent. Is uvicorn still running?" : err.message);
    } finally {
      state.loading = false;
      $("refresh").disabled = false;
      render();
      clearTimeout(pendingTimer);
      if (state.failures.some((f) => f.diagnosing)) pendingTimer = setTimeout(load, PENDING_POLL_MS);
    }
  }

  async function openPullRequest(f) {
    const res = await fetch("/pull-requests", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Agent-Token": CFG.token },
      // Only the id: the agent opens the PR from its own copy of the diagnosis.
      body: JSON.stringify({ id: f.id }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.detail || `agent returned ${res.status}`);
    return body;
  }

  // ------------------------------------------------------------------ view helpers
  function setStatus(kind, text) {
    const el = $("status");
    el.className = "status " + kind;
    el.textContent = text;
  }
  function showBanner(msg) { const b = $("banner"); b.textContent = msg; b.hidden = false; }
  function hideBanner() { $("banner").hidden = true; }

  const catBadge = (cat) => cat && CATEGORIES[cat]
    ? `<span class="badge cat-${esc(cat)}">${esc(CATEGORIES[cat])}</span>`
    : `<span class="badge">Unclassified</span>`;

  const typeBadge = (f) => f.diagnosing
    ? `<span class="badge pending">Diagnosing…</span>`
    : f.diagnosed && CATEGORIES[f.cat]
      ? `<span class="badge cat-${esc(f.cat)}">${esc(f.type)}</span>`
      : `<span class="badge">Unclassified</span>`;

  const confBadge = (f) => f.diagnosed && CONF_RANK[f.confidence]
    ? `<span class="badge conf-${esc(f.confidence)}">${esc(f.confidence)}</span>`
    : `<span class="none">—</span>`;

  function whenText(f) {
    const multiDay = $("start").value !== $("end").value;
    const [, m, d] = (f.day || "").split("-");
    return (multiDay && m ? `${+m}/${+d} ` : "") + (f.time || "");
  }

  // Why the PR button is disabled, or null when it can be used. Mirrors pr_blocker() in
  // agent/main.py, which enforces the same rules server-side.
  function prBlocker(f) {
    if (f.diagnosing) return "Diagnosis in progress";
    if (!f.diagnosed) return "Needs a diagnosis first";
    if (!PATCHABLE.has(f.rootCause)) return f.rootCause
      ? `Root cause is in the ${f.rootCause} — fix it at the source`
      : "Diagnosis doesn't say where the root cause is";
    if (!f.patch) return "No code change suggested";
    if (f.confidence !== "High") return "Only High-confidence fixes can open a PR";
    if (f.patchError) return "Patch doesn't apply to the current code";
    if (f.policyError) return "Patch breaks the migration rules";
    if (!CFG || !CFG.prRepo) return "Set GITHUB_REPO on the agent to enable PRs";
    return null;
  }
  const prReady = (f) => !state.prResults[f.id] && prBlocker(f) === null;

  function matchesConfidence(f, want) {
    if (!want) return true;
    if (want === "ready") return prReady(f);
    if (want === "none") return !f.diagnosed;
    return f.diagnosed && f.confidence === want;
  }

  function visibleFailures() {
    const cat = $("cat").value, conf = $("conf").value;
    const q = $("q").value.trim().toLowerCase();
    const rows = state.failures.filter((f) =>
      (!cat || (cat === "_none" ? !(f.diagnosed && CATEGORIES[f.cat]) : f.diagnosed && f.cat === cat)) &&
      matchesConfidence(f, conf) &&
      (!q || [f.dag, f.task, f.error, f.type].some((s) => (s || "").toLowerCase().includes(q))));
    const { key, dir } = state.sort;
    const when = (f) => (f.day || "") + " " + (f.time || "");
    const val = (f) => key === "dag" ? f.dag + "::" + f.task
      : key === "runs" ? f.occurrences || 1
      // Within a confidence level, PR-ready fixes first, then newest.
      : key === "conf" ? `${f.diagnosed ? CONF_RANK[f.confidence] || 0 : 0}${prReady(f) ? 1 : 0} ${when(f)}`
      : when(f);
    return rows.sort((a, b) => (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : 0) * dir);
  }

  // ------------------------------------------------------------------ render
  function render() {
    renderHeader();
    renderStats();
    renderCategoryOptions();
    renderTable();
    renderPanel();
  }

  function renderHeader() {
    document.querySelectorAll("[data-audience]").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.audience === state.audience)));
    $("when-h").firstChild.textContent = tzAbbr ? `When (${tzAbbr})` : "When";
    const n = state.failures.length, shown = visibleFailures().length;
    $("count").textContent = state.lastSync ? `${shown} of ${n} failing` : "";
    if (state.lastSync && CFG) {
      const host = CFG.airflowUrl.replace(/^https?:\/\//, "");
      $("subline").textContent = `Airflow at ${host} · refreshed ${state.lastSync.toLocaleTimeString([], { hour12: false })}`;
    }
  }

  function renderStats() {
    const fs = state.failures;
    $("s-tasks").textContent = fs.length;
    $("s-runs").textContent = fs.reduce((n, f) => n + (f.occurrences || 1), 0);
    $("s-diag").textContent = fs.length ? `${fs.filter((f) => f.diagnosed).length} / ${fs.length}` : "–";
    const running = fs.filter((f) => f.diagnosing).length;
    $("s-diag-l").textContent = running ? `Diagnosed · ${running} in progress` : "Diagnosed";
    $("s-ready").textContent = fs.length ? fs.filter(prReady).length : "–";
  }

  function renderCategoryOptions() {
    const sel = $("cat"), current = sel.value;
    const present = [...new Set(state.failures.map((f) => (f.diagnosed && CATEGORIES[f.cat] ? f.cat : "_none")))];
    sel.innerHTML = `<option value="">All failure types</option>` + present.sort().map((c) =>
      `<option value="${esc(c)}">${esc(c === "_none" ? "Unclassified" : CATEGORIES[c])}</option>`).join("");
    sel.value = present.includes(current) ? current : "";
  }

  function renderTable() {
    const rows = visibleFailures();
    $("rows").innerHTML = rows.map((f) => `
      <tr data-id="${esc(f.id)}" tabindex="0" class="${f.id === state.selectedId ? "active" : ""}">
        <td><span class="dot" title="Failed"></span></td>
        <td class="col-main">
          <div class="dag">${esc(f.dag)}</div>
          <div class="task">${esc(f.task)}</div>
          ${f.error ? `<div class="err-line" title="${esc(f.error)}">${esc(f.error)}</div>` : ""}
        </td>
        <td class="col-type">${typeBadge(f)}</td>
        <td class="col-conf">${confBadge(f)}${prReady(f) ? `<span class="chip ready" title="High confidence, and the patch applies cleanly">PR ready</span>` : ""}</td>
        <td class="col-env"><span class="chip env">${esc(f.env)}</span></td>
        <td class="col-when when">${esc(whenText(f))}</td>
        <td class="col-runs num">${esc(f.occurrences || 1)}</td>
      </tr>`).join("");

    const empty = $("empty");
    empty.hidden = rows.length > 0;
    if (!rows.length) {
      const range = $("start").value === $("end").value
        ? $("start").value : `${$("start").value} → ${$("end").value}`;
      empty.innerHTML = state.failures.length
        ? `<strong>No failures match these filters</strong>Clear the search or filters to see all ${state.failures.length}.`
        : state.lastSync
          ? `<strong>No failed tasks</strong>Nothing failed in Airflow on ${esc(range)}.`
          : `<strong>${CFG ? "Loading…" : "Not connected"}</strong>`;
    }

    document.querySelectorAll("th button[data-sort]").forEach((b) => {
      const on = b.dataset.sort === state.sort.key;
      b.querySelector(".sort-arrow").textContent = on ? (state.sort.dir > 0 ? "▲" : "▼") : "";
      b.parentElement.setAttribute("aria-sort", on ? (state.sort.dir > 0 ? "ascending" : "descending") : "none");
    });
  }

  function renderPanel() {
    const panel = $("panel");
    const f = state.failures.find((x) => x.id === state.selectedId);
    $("layout").classList.toggle("open", !!f);
    panel.hidden = !f;
    if (!f) { panel.innerHTML = ""; return; }

    const scroll = panel.querySelector(".panel-body")?.scrollTop || 0;
    const airflowLink = CFG && CFG.airflowUrl
      ? `${CFG.airflowUrl}/dags/${encodeURIComponent(f.dag)}/runs/${encodeURIComponent(f.run_id)}/tasks/${encodeURIComponent(f.task)}`
      : null;
    const cause = (f.cause || {})[state.audience] || "";

    const diagnosis = f.diagnosed ? `
      <div class="diag-type">
        <strong>${esc(f.type)}</strong>${catBadge(f.cat)}
        <span class="badge conf-${esc(f.confidence)}">${esc(f.confidence)} confidence</span>
        ${ROOT_LABEL[f.rootCause] ? `<span class="chip root root-${esc(f.rootCause)}" title="Where the root cause lives">Root cause: ${esc(ROOT_LABEL[f.rootCause])}</span>` : ""}
      </div>
      <p class="cause">${esc(cause)}</p>
      ${f.impact ? `<p class="impact">${esc(f.impact)}</p>` : ""}
      ${usageLine(f.usage)}` : `
      <div class="notice">${f.diagnosing ? `<span class="badge pending">Diagnosing…</span> ` : ""}${esc((f.cause || {}).analyst || "Not diagnosed.")}
        ${f.error ? `<span class="mono">${esc(f.error)}</span>` : ""}
      </div>`;

    const hasDiff = (f.diff || []).length > 0;
    const heading = f.patchWithheld ? "Recommended action" : hasDiff ? "Suggested fix" : "Recommended action";
    const diff = f.diagnosed ? `
      <div class="section">
        <h3>${heading}</h3>
        <div>${esc(f.fixSummary)}</div>
        ${f.patchWithheld ? `<div class="withheld">The root cause is in the ${esc(f.rootCause)}, so this code change
          would only hide it. It's shown for reference and can't be raised as a PR.</div>` : ""}
        ${hasDiff ? `<div class="diff${f.patchWithheld ? " muted" : ""}">${f.diff.map((d) => {
          const t = ["add", "del", "file", "hunk"].includes(d.t) ? d.t : "ctx";
          const mark = { add: "+ ", del: "- ", ctx: "  " }[t] || "";
          return `<div class="${t}">${mark}${esc(d.s)}</div>`;
        }).join("")}</div>` : `<div class="file">No code change suggested — this needs a person to act on.</div>`}
        ${f.policyError && !f.patchWithheld ? `<div class="patch-warn">This change breaks the migration rules (additive DDL only, new files only), so it can't be raised as a PR.
          <span class="mono">${esc(f.policyError)}</span></div>` : ""}
        ${f.patchError ? `<div class="patch-warn">This patch doesn't apply cleanly to the current code, so it can't be raised as a PR.
          <span class="mono">${esc(f.patchError)}</span></div>` : ""}
      </div>` : "";

    panel.innerHTML = `
      <div class="panel-head">
        <div class="panel-title">
          <div><div class="dag">${esc(f.dag)}</div><div class="task">${esc(f.task)}</div></div>
          <button class="icon-btn" type="button" data-action="close" aria-label="Close details">×</button>
        </div>
        <div class="meta">
          <span>Env <b>${esc(f.env)}</b></span>
          <span>Operator <b>${esc(f.operator)}</b></span>
          <span>Try <b>${esc(f.try_number)}</b></span>
          <span>${esc(f.duration)}</span>
          <span>${esc(f.day)} ${esc(f.time)} ${esc(tzAbbr)}</span>
          ${airflowLink ? `<a href="${esc(airflowLink)}" target="_blank" rel="noopener">Open in Airflow ↗</a>` : ""}
        </div>
        <div class="meta"><span class="mono">${esc(f.run_id)}</span></div>
      </div>
      <div class="panel-body">
        <div class="section">
          <h3>Evidence · task log</h3>
          <pre class="log">${(f.log || []).map((l) =>
            `<span class="${esc(l.sev)}">${esc(l.t)}</span>`).join("\n")}</pre>
        </div>
        <div class="section">
          <h3>Diagnosis ${f.diagnosed ? `<span class="aud">· for ${state.audience === "analyst" ? "analysts" : "engineers"}</span>` : ""}</h3>
          ${diagnosis}
        </div>
        ${diff}
      </div>
      <div class="panel-foot">${prFooter(f)}</div>`;
    panel.querySelector(".panel-body").scrollTop = scroll;
  }

  function usageLine(u) {
    if (!u) return "";
    const n = (x) => Number(x || 0).toLocaleString();
    const cost = u.cost_usd == null ? "" : ` · $${Number(u.cost_usd).toFixed(4)}`;
    return `<div class="usage">Diagnosed by ${esc(u.model)} · ${n(u.input_tokens)} in / ${n(u.output_tokens)} out tokens${cost} · ${esc(u.seconds)}s</div>`;
  }

  function prFooter(f) {
    const done = state.prResults[f.id];
    if (done) {
      const safe = /^https:\/\/github\.com\//.test(done.url || "");
      return `<span class="pr-done">PR #${esc(done.number)} opened · awaiting review</span>
        ${safe ? `<a href="${esc(done.url)}" target="_blank" rel="noopener">View on GitHub ↗</a>` : ""}`;
    }
    const why = prBlocker(f);
    return `<span class="why">${esc(why || "Opens a PR for review — nothing merges automatically.")}</span>
      <button class="btn primary" type="button" data-action="raise-pr" ${why ? "disabled" : ""}>Raise PR</button>`;
  }

  // ------------------------------------------------------------------ PR modal
  function openModal(f) {
    const modal = $("modal");
    modal.innerHTML = `
      <h2 id="modal-title">Open a pull request?</h2>
      <p>The agent will branch from <span class="mono">main</span>, apply the suggested change, push, and open a PR. It will not merge anything.</p>
      <dl>
        <dt>Repository</dt><dd>${esc(CFG.prRepo)}</dd>
        <dt>Branch</dt><dd>${esc(f.prBranch)}</dd>
        <dt>File</dt><dd>${esc(f.fixFile)}</dd>
        <dt>Title</dt><dd>${esc(f.prTitle)}</dd>
      </dl>
      ${(f.fixFile || "").includes("sql/migrations/") ? `<p>This adds a schema migration. Merging the PR doesn't change the warehouse;
        after review, apply it with <span class="mono">python -m scripts.migrate</span>.</p>` : ""}
      <div class="error" id="modal-error" hidden></div>
      <div class="actions">
        <button class="btn" type="button" data-action="cancel">Cancel</button>
        <button class="btn primary" type="button" data-action="approve">Approve &amp; open PR</button>
      </div>`;
    $("modal-bg").classList.add("show");
    modal.querySelector('[data-action="cancel"]').focus();

    modal.onclick = async (e) => {
      const action = e.target.closest("button")?.dataset.action;
      if (action === "cancel") return closeModal();
      if (action !== "approve") return;
      const btn = e.target.closest("button");
      btn.disabled = true;
      btn.textContent = "Opening…";
      try {
        state.prResults[f.id] = await openPullRequest(f);
        closeModal();
        render();
      } catch (err) {
        const box = $("modal-error");
        box.hidden = false;
        box.textContent = err.message;
        btn.disabled = false;
        btn.textContent = "Try again";
      }
    };
  }
  function closeModal() { $("modal-bg").classList.remove("show"); }

  // ------------------------------------------------------------------ events
  function select(id) {
    state.selectedId = state.selectedId === id ? null : id;
    renderTable();
    renderPanel();
  }

  $("rows").addEventListener("click", (e) => {
    const tr = e.target.closest("tr[data-id]");
    if (tr) select(tr.dataset.id);
  });
  $("rows").addEventListener("keydown", (e) => {
    const tr = e.target.closest("tr[data-id]");
    if (!tr) return;
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(tr.dataset.id); }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      (e.key === "ArrowDown" ? tr.nextElementSibling : tr.previousElementSibling)?.focus();
    }
  });

  document.querySelector(".seg").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-audience]");
    if (!btn) return;
    state.audience = btn.dataset.audience;
    store.set("triage.audience", state.audience);
    renderHeader();
    renderPanel();
  });

  $("panel").addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    if (btn.dataset.action === "close") { state.selectedId = null; renderTable(); renderPanel(); }
    if (btn.dataset.action === "raise-pr") {
      const f = state.failures.find((x) => x.id === state.selectedId);
      if (f && !prBlocker(f)) openModal(f);
    }
  });

  document.querySelectorAll("th button[data-sort]").forEach((b) => b.addEventListener("click", () => {
    const key = b.dataset.sort;
    state.sort = state.sort.key === key ? { key, dir: -state.sort.dir } : { key, dir: key === "dag" ? 1 : -1 };
    renderTable();
  }));

  const refilter = () => { renderHeader(); renderTable(); };
  $("q").addEventListener("input", refilter);
  $("cat").addEventListener("change", refilter);
  $("conf").addEventListener("change", refilter);
  $("refresh").addEventListener("click", load);
  ["start", "end"].forEach((id) => $(id).addEventListener("change", () => {
    if ($("end").value < $("start").value) $(id === "start" ? "end" : "start").value = $(id).value;
    load();
  }));

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if ($("modal-bg").classList.contains("show")) closeModal();
    else if (state.selectedId) { state.selectedId = null; renderTable(); renderPanel(); }
  });
  $("modal-bg").addEventListener("click", (e) => { if (e.target === $("modal-bg")) closeModal(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });

  // ------------------------------------------------------------------ boot
  $("start").value = $("end").value = today();
  $("end").max = today();
  $("subtitle").textContent = CFG ? `Local Airflow · ${CFG.env} · times in ${tzAbbr}` : "Airflow";
  render();
  load();
  setInterval(() => { if (!document.hidden) load(); }, POLL_MS);
})();
</script>
</body>
</html>
