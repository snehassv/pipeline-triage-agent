<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Triage</title>
<!-- agent-config -->
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #f1f3f6;
    --border: #e2e5ea;
    --text: #1b1f27;
    --muted: #677084;
    --faint: #98a0b0;
    --accent: #3056d3;
    --accent-text: #ffffff;
    --row-hover: #f4f6fb;
    --row-active: #eaf0ff;
    --err: #c2323f;
    --err-bg: #fdecee;
    --warn: #9a6a12;
    --warn-bg: #fdf4e1;
    --ok: #1d7f4f;
    --ok-bg: #e5f5ec;
    --code-bg: #10141c;
    --code-text: #d7dbe3;
    --code-err: #ff8b93;
    --code-warn: #e9c46a;
    --code-info: #8a93a6;
    --diff-add-bg: #e6f6ec;
    --diff-add: #196c40;
    --diff-del-bg: #fdebed;
    --diff-del: #a42a36;
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
    --overlay: rgba(15, 20, 30, .45);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116;
      --surface: #161a21;
      --surface-2: #1d222b;
      --border: #2a303b;
      --text: #e6e9ef;
      --muted: #9aa3b4;
      --faint: #6b7385;
      --accent: #6d8dff;
      --accent-text: #0e1116;
      --row-hover: #1c212a;
      --row-active: #1f2a44;
      --err: #ff7b86;
      --err-bg: #3a1d22;
      --warn: #e9b949;
      --warn-bg: #3a2f17;
      --ok: #5fd39a;
      --ok-bg: #173226;
      --code-bg: #0a0d12;
      --diff-add-bg: #15301f;
      --diff-add: #7fe0a8;
      --diff-del-bg: #3a1a1f;
      --diff-del: #ff9aa3;
      --shadow: none;
      --overlay: rgba(0, 0, 0, .6);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); }
  button, input, select { font: inherit; color: inherit; }
  a { color: var(--accent); }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo {
    width: 30px; height: 30px; border-radius: 8px; background: var(--accent); flex: none;
    display: grid; place-items: center; color: var(--accent-text); font-weight: 700; font-size: 13px;
  }
  .brand h1 { margin: 0; font-size: 15px; letter-spacing: -.2px; }
  .brand p { margin: 0; font-size: 12px; color: var(--muted); }
  .status {
    display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--muted);
  }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .status.live { background: var(--ok-bg); color: var(--ok); }
  .status.offline { background: var(--err-bg); color: var(--err); }

  /* ---------- page ---------- */
  .page { padding: 20px 24px 40px; max-width: 1480px; margin: 0 auto; }
  .controls { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; margin-bottom: 16px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .field input, .field select {
    height: 34px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
  }
  .field.grow { flex: 1 1 220px; }
  .field.grow input { width: 100%; }
  .btn {
    height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); cursor: pointer; font-weight: 600; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .banner {
    display: none; margin-bottom: 16px; padding: 10px 14px; border-radius: 8px;
    background: var(--err-bg); color: var(--err); font-weight: 500;
  }
  .banner.show { display: block; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow); }
  .stat .v { font-size: 22px; font-weight: 700; letter-spacing: -.5px; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 12px; color: var(--muted); }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
  .layout.open { grid-template-columns: minmax(0, 1fr) minmax(420px, 560px); }

  /* ---------- table ---------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface-2);
    white-space: nowrap;
  }
  th button { all: unset; cursor: pointer; }
  th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  th .arrow { color: var(--faint); margin-left: 4px; }
  td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr.active { background: var(--row-active); }
  tbody tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .dag { font-family: var(--mono); font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
  .task { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  td:first-child { min-width: 210px; }
  .err-cell {
    font-family: var(--mono); font-size: 12px; color: var(--err);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word;
  }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .when { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .empty { padding: 48px 20px; text-align: center; color: var(--muted); }
  .empty strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
    background: var(--surface-2); color: var(--muted);
  }
  .cat-schema { background: #e8effd; color: #2d57a8; }
  .cat-merge  { background: #f3e8fd; color: #7a3db0; }
  .cat-dq     { background: #fdf0e3; color: #a55b12; }
  .cat-sensor { background: #e3f6f6; color: #11777a; }
  .cat-table  { background: #fde8ef; color: #ae2f5d; }
  .cat-gcs    { background: #eef4e2; color: #52731a; }
  .cat-auth   { background: #f1eee4; color: #6f5f2a; }
  @media (prefers-color-scheme: dark) {
    .cat-schema { background: #1c2a45; color: #8fb0ff; }
    .cat-merge  { background: #2e1f40; color: #cfa1ff; }
    .cat-dq     { background: #3a2a17; color: #f2b36a; }
    .cat-sensor { background: #133335; color: #6fdadd; }
    .cat-table  { background: #3a1a28; color: #ff94bb; }
    .cat-gcs    { background: #243017; color: #b3d67a; }
    .cat-auth   { background: #312b1a; color: #d9c58a; }
  }
  .conf-High   { background: var(--ok-bg); color: var(--ok); }
  .conf-Medium { background: var(--warn-bg); color: var(--warn); }
  .conf-Low    { background: var(--err-bg); color: var(--err); }
  .badge.pending { background: var(--row-active); color: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .badge.pending { animation: none; } }

  /* ---------- detail panel ---------- */
  .panel { position: sticky; top: 16px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
  .panel-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--border); }
  .panel-title { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
  .panel-title .dag { font-size: 14px; }
  .icon-btn {
    border: 0; background: transparent; cursor: pointer; width: 28px; height: 28px; border-radius: 6px;
    color: var(--muted); font-size: 18px; line-height: 1; flex: none;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .meta span b { color: var(--text); font-weight: 600; }
  .panel-body { padding: 4px 18px 18px; overflow-y: auto; flex: 1; }
  .section { margin-top: 18px; }
  .section h3 {
    margin: 0 0 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .log {
    margin: 0; padding: 12px 14px; border-radius: 8px; background: var(--code-bg); color: var(--code-text);
    font: 12px/1.55 var(--mono); overflow-x: auto; white-space: pre-wrap; word-break: break-word;
  }
  .log .err { color: var(--code-err); }
  .log .warn { color: var(--code-warn); }
  .log .info { color: var(--code-info); }
  .diag-type { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
  .diag-type strong { font-size: 15px; }
  .toggle { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--surface-2); }
  .toggle button {
    border: 0; background: transparent; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600;
    color: var(--muted); cursor: pointer; text-transform: none; letter-spacing: 0;
  }
  .toggle button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .toggle button:disabled { cursor: not-allowed; opacity: .55; }
  .usage { margin-top: 10px; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .cause { margin: 0; line-height: 1.6; }
  .impact { margin: 10px 0 0; padding: 8px 12px; border-left: 3px solid var(--warn); background: var(--warn-bg); border-radius: 0 6px 6px 0; font-size: 13px; }
  .notice { padding: 12px 14px; border-radius: 8px; background: var(--surface-2); color: var(--muted); font-size: 13px; }
  .notice .mono { color: var(--err); display: block; margin-top: 6px; word-break: break-word; }
  .file { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 6px 0 8px; }
  .diff { border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; font: 12px/1.6 var(--mono); }
  .diff div { padding: 0 12px; white-space: pre; }
  .diff .add { background: var(--diff-add-bg); color: var(--diff-add); }
  .diff .del { background: var(--diff-del-bg); color: var(--diff-del); }
  .diff .ctx { color: var(--muted); }
  .diff .file { background: var(--surface-2); color: var(--text); font-weight: 600; padding-top: 4px; padding-bottom: 4px; }
  .diff .hunk { color: var(--faint); background: var(--surface-2); }
  .patch-warn { margin-top: 8px; padding: 8px 12px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); font-size: 12.5px; }
  .patch-warn .mono { display: block; margin-top: 4px; font-size: 11.5px; white-space: pre-wrap; word-break: break-word; }
  .panel-foot { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .panel-foot .why { font-size: 12px; color: var(--muted); }
  .pr-done { font-size: 13px; color: var(--ok); font-weight: 600; }

  /* ---------- modal ---------- */
  .modal-bg { position: fixed; inset: 0; background: var(--overlay); display: none; place-items: center; padding: 16px; z-index: 50; }
  .modal-bg.show { display: grid; }
  .modal { width: min(480px, 100%); background: var(--surface); border-radius: 12px; border: 1px solid var(--border); padding: 20px; }
  .modal h2 { margin: 0 0 6px; font-size: 16px; }
  .modal p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .modal dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 0 0 18px; font-size: 13px; }
  .modal dt { color: var(--muted); }
  .modal dd { margin: 0; font-family: var(--mono); font-size: 12px; word-break: break-all; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .modal .error { color: var(--err); font-size: 13px; margin: -6px 0 14px; }

  /* ---------- mid-width with the panel open: keep the table to its essentials ---------- */
  .table-wrap { overflow-x: auto; }
  @media (max-width: 1320px) {
    .layout.open .col-cat, .layout.open .col-when, .layout.open .col-runs { display: none; }
    .layout.open { grid-template-columns: minmax(0, 1fr) minmax(380px, 480px); }
  }

  /* ---------- narrow screens: panel becomes a full-screen sheet ---------- */
  @media (max-width: 1000px) {
    .layout.open { grid-template-columns: minmax(0, 1fr); }
    .panel { position: fixed; inset: 0; top: 0; max-height: none; border-radius: 0; z-index: 40; }
    .col-when, .col-runs { display: none; }
  }
  @media (max-width: 640px) {
    header, .page { padding-left: 16px; padding-right: 16px; }
    .col-cat { display: none; }
    td, th { padding: 10px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo" aria-hidden="true">PT</div>
    <div>
      <h1>Pipeline Triage</h1>
      <p id="subtitle">Airflow</p>
    </div>
  </div>
  <span id="status" class="status">Connecting…</span>
</header>

<div class="page">
  <div class="controls">
    <div class="field"><label for="start">From</label><input type="date" id="start"></div>
    <div class="field"><label for="end">To</label><input type="date" id="end"></div>
    <div class="field">
      <label for="cat">Category</label>
      <select id="cat"><option value="">All categories</option></select>
    </div>
    <div class="field grow"><label for="q">Search</label><input id="q" type="search" placeholder="DAG, task or error text"></div>
    <button class="btn" id="refresh" type="button">Refresh</button>
  </div>

  <div id="banner" class="banner" role="alert"></div>

  <div class="stats">
    <div class="stat"><div class="v" id="s-tasks">–</div><div class="l">Failing tasks</div></div>
    <div class="stat"><div class="v" id="s-runs">–</div><div class="l">Failed runs</div></div>
    <div class="stat"><div class="v" id="s-dags">–</div><div class="l">DAGs affected</div></div>
    <div class="stat"><div class="v" id="s-diag">–</div><div class="l" id="s-diag-l">Diagnosed</div></div>
  </div>

  <div id="layout" class="layout">
    <div class="card table-wrap">
      <table>
        <thead>
          <tr>
            <th><button type="button" data-sort="dag">DAG / task<span class="arrow"></span></button></th>
            <th>Error</th>
            <th class="col-cat">Category</th>
            <th class="col-when"><button type="button" data-sort="when">When<span class="arrow"></span></button></th>
            <th class="col-runs num"><button type="button" data-sort="runs">Runs<span class="arrow"></span></button></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty" hidden></div>
    </div>
    <aside id="panel" class="card panel" hidden aria-label="Failure details"></aside>
  </div>
</div>

<div id="modal-bg" class="modal-bg" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal" id="modal"></div>
</div>

<script>
(() => {
  "use strict";

  // Injected by the agent at serve time (see agent/main.py). Opening this file from disk
  // leaves it undefined, and the page says so instead of silently failing.
  const CFG = window.__AGENT_CONFIG || null;
  const POLL_MS = 30000;
  const PENDING_POLL_MS = 3000;   // while diagnoses are running in the background
  let pendingTimer = null;
  const CATEGORIES = {
    schema: "Schema", merge: "Merge", dq: "Data quality", sensor: "Sensor",
    table: "Table", gcs: "File / export", auth: "Auth",
  };

  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const store = {
    get(k, d) { try { return localStorage.getItem(k) || d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode */ } },
  };

  const state = {
    failures: [],
    selectedId: null,
    audience: store.get("triage.audience", "engineer"),
    sort: { key: "when", dir: -1 },
    prResults: {},        // failure id -> {number, url}
    loading: false,
    lastSync: null,
  };

  const tz = (CFG && CFG.timezone) || Intl.DateTimeFormat().resolvedOptions().timeZone;
  const today = () => new Intl.DateTimeFormat("en-CA", { timeZone: tz }).format(new Date());
  const tzAbbr = (() => {
    const part = new Intl.DateTimeFormat("en-US", { timeZone: tz, timeZoneName: "short" })
      .formatToParts(new Date()).find((p) => p.type === "timeZoneName");
    return part ? part.value : "";
  })();

  // ------------------------------------------------------------------ data
  async function load() {
    if (!CFG) {
      setStatus("offline", "Not connected");
      showBanner("Open this dashboard through the agent (uvicorn agent.main:app --port 8787, then http://localhost:8787) — opened from disk it has no API token.");
      renderTable();
      return;
    }
    if (state.loading) return;
    state.loading = true;
    $("refresh").disabled = true;
    const qs = new URLSearchParams({ start: $("start").value, end: $("end").value });
    try {
      const res = await fetch("/failures?" + qs, { headers: { "X-Agent-Token": CFG.token } });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.detail || `agent returned ${res.status}`);
      state.failures = Array.isArray(body) ? body : body.failures || [];
      state.lastSync = new Date();
      hideBanner();
      setStatus("live", "Live · synced " + state.lastSync.toLocaleTimeString([], { hour12: false }));
      if (state.selectedId && !state.failures.some((f) => f.id === state.selectedId)) state.selectedId = null;
    } catch (err) {
      const offline = err instanceof TypeError;   // fetch() itself failed: agent not running
      setStatus("offline", offline ? "Agent offline" : "Error");
      showBanner(offline ? "Can't reach the agent. Is uvicorn still running?" : err.message);
    } finally {
      state.loading = false;
      $("refresh").disabled = false;
      render();
      clearTimeout(pendingTimer);
      if (state.failures.some((f) => f.diagnosing)) pendingTimer = setTimeout(load, PENDING_POLL_MS);
    }
  }

  async function openPullRequest(f) {
    const res = await fetch("/pull-requests", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Agent-Token": CFG.token },
      // Only the id: the agent opens the PR from its own copy of the diagnosis.
      body: JSON.stringify({ id: f.id }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.detail || `agent returned ${res.status}`);
    return body;
  }

  // ------------------------------------------------------------------ view helpers
  function setStatus(kind, text) {
    const el = $("status");
    el.className = "status " + kind;
    el.textContent = text;
  }
  function showBanner(msg) { const b = $("banner"); b.textContent = msg; b.classList.add("show"); }
  function hideBanner() { $("banner").classList.remove("show"); }

  const catBadge = (cat) => cat && CATEGORIES[cat]
    ? `<span class="badge cat-${esc(cat)}">${esc(CATEGORIES[cat])}</span>`
    : `<span class="badge">Unclassified</span>`;

  function whenText(f) {
    const multiDay = $("start").value !== $("end").value;
    const [, m, d] = (f.day || "").split("-");
    return (multiDay && m ? `${+m}/${+d} ` : "") + (f.time || "");
  }

  function visibleFailures() {
    const cat = $("cat").value;
    const q = $("q").value.trim().toLowerCase();
    const rows = state.failures.filter((f) =>
      (!cat || (cat === "_none" ? !CATEGORIES[f.cat] : f.cat === cat)) &&
      (!q || [f.dag, f.task, f.error, f.type].some((s) => (s || "").toLowerCase().includes(q))));
    const { key, dir } = state.sort;
    const val = (f) => key === "dag" ? f.dag + "::" + f.task
      : key === "runs" ? f.occurrences || 1
      : (f.day || "") + " " + (f.time || "");
    return rows.sort((a, b) => (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : 0) * dir);
  }

  // ------------------------------------------------------------------ render
  function render() {
    renderStats();
    renderCategoryOptions();
    renderTable();
    renderPanel();
  }

  function renderStats() {
    const fs = state.failures;
    $("s-tasks").textContent = fs.length;
    $("s-runs").textContent = fs.reduce((n, f) => n + (f.occurrences || 1), 0);
    $("s-dags").textContent = new Set(fs.map((f) => f.dag)).size;
    $("s-diag").textContent = fs.length ? `${fs.filter((f) => f.diagnosed).length} / ${fs.length}` : "–";
    const running = fs.filter((f) => f.diagnosing).length;
    $("s-diag-l").textContent = running ? `Diagnosed · ${running} in progress` : "Diagnosed";
  }

  function renderCategoryOptions() {
    const sel = $("cat"), current = sel.value;
    const present = [...new Set(state.failures.map((f) => (CATEGORIES[f.cat] ? f.cat : "_none")))];
    sel.innerHTML = `<option value="">All categories</option>` + present.sort().map((c) =>
      `<option value="${esc(c)}">${esc(c === "_none" ? "Unclassified" : CATEGORIES[c])}</option>`).join("");
    sel.value = present.includes(current) ? current : "";
  }

  function renderTable() {
    const rows = visibleFailures();
    $("rows").innerHTML = rows.map((f) => `
      <tr data-id="${esc(f.id)}" tabindex="0" class="${f.id === state.selectedId ? "active" : ""}">
        <td><div class="dag">${esc(f.dag)}</div><div class="task">${esc(f.task)}</div></td>
        <td><div class="err-cell" title="${esc(f.error)}">${esc(f.error || f.type || "—")}</div></td>
        <td class="col-cat">${f.diagnosing ? `<span class="badge pending">Diagnosing…</span>` : catBadge(f.cat)}</td>
        <td class="col-when when">${esc(whenText(f))}</td>
        <td class="col-runs num">${esc(f.occurrences || 1)}</td>
      </tr>`).join("");

    const empty = $("empty");
    empty.hidden = rows.length > 0;
    if (!rows.length) {
      const range = $("start").value === $("end").value
        ? $("start").value : `${$("start").value} → ${$("end").value}`;
      empty.innerHTML = state.failures.length
        ? `<strong>No failures match these filters</strong>Clear the search or category to see all ${state.failures.length}.`
        : state.lastSync
          ? `<strong>No failed tasks</strong>Nothing failed in Airflow on ${esc(range)}.`
          : `<strong>${CFG ? "Loading…" : "Not connected"}</strong>`;
    }

    document.querySelectorAll("th button[data-sort]").forEach((b) => {
      const on = b.dataset.sort === state.sort.key;
      b.querySelector(".arrow").textContent = on ? (state.sort.dir > 0 ? "▲" : "▼") : "";
      b.parentElement.setAttribute("aria-sort", on ? (state.sort.dir > 0 ? "ascending" : "descending") : "none");
    });
  }

  function renderPanel() {
    const panel = $("panel");
    const f = state.failures.find((x) => x.id === state.selectedId);
    $("layout").classList.toggle("open", !!f);
    panel.hidden = !f;
    if (!f) { panel.innerHTML = ""; return; }

    const scroll = panel.querySelector(".panel-body")?.scrollTop || 0;
    const airflowLink = CFG && CFG.airflowUrl
      ? `${CFG.airflowUrl}/dags/${encodeURIComponent(f.dag)}/runs/${encodeURIComponent(f.run_id)}/tasks/${encodeURIComponent(f.task)}`
      : null;
    const cause = (f.cause || {})[state.audience] || "";

    const diagnosis = f.diagnosed ? `
      <div class="diag-type">
        <strong>${esc(f.type)}</strong>${catBadge(f.cat)}
        <span class="badge conf-${esc(f.confidence)}">${esc(f.confidence)} confidence</span>
      </div>
      <p class="cause">${esc(cause)}</p>
      ${f.impact ? `<p class="impact">${esc(f.impact)}</p>` : ""}
      ${usageLine(f.usage)}` : `
      <div class="notice">${f.diagnosing ? `<span class="badge pending">Diagnosing…</span> ` : ""}${esc((f.cause || {}).analyst || "Not diagnosed.")}
        ${f.error ? `<span class="mono">${esc(f.error)}</span>` : ""}
      </div>`;

    const hasDiff = (f.diff || []).length > 0;
    const diff = f.diagnosed ? `
      <div class="section">
        <h3>${hasDiff ? "Suggested fix" : "Recommended action"}</h3>
        <div>${esc(f.fixSummary)}</div>
        ${hasDiff ? `<div class="diff">${f.diff.map((d) => {
          const t = ["add", "del", "file", "hunk"].includes(d.t) ? d.t : "ctx";
          const mark = { add: "+ ", del: "- ", ctx: "  " }[t] || "";
          return `<div class="${t}">${mark}${esc(d.s)}</div>`;
        }).join("")}</div>` : `<div class="file">No code change suggested — this needs a person to act on.</div>`}
        ${f.patchError ? `<div class="patch-warn">This patch doesn't apply cleanly to the current code, so it can't be raised as a PR.
          <span class="mono">${esc(f.patchError)}</span></div>` : ""}
      </div>` : "";

    panel.innerHTML = `
      <div class="panel-head">
        <div class="panel-title">
          <div><div class="dag">${esc(f.dag)}</div><div class="task">${esc(f.task)}</div></div>
          <button class="icon-btn" type="button" data-action="close" aria-label="Close details">×</button>
        </div>
        <div class="meta">
          <span>Env <b>${esc(f.env)}</b></span>
          <span>Operator <b>${esc(f.operator)}</b></span>
          <span>Try <b>${esc(f.try_number)}</b></span>
          <span>${esc(f.duration)}</span>
          <span>${esc(f.day)} ${esc(f.time)} ${esc(tzAbbr)}</span>
          ${airflowLink ? `<a href="${esc(airflowLink)}" target="_blank" rel="noopener">Open in Airflow ↗</a>` : ""}
        </div>
        <div class="meta"><span class="mono">${esc(f.run_id)}</span></div>
      </div>
      <div class="panel-body">
        <div class="section">
          <h3>Evidence · task log</h3>
          <pre class="log">${(f.log || []).map((l) =>
            `<span class="${esc(l.sev)}">${esc(l.t)}</span>`).join("\n")}</pre>
        </div>
        <div class="section">
          <h3>Diagnosis
            <span class="toggle" role="group" aria-label="Explanation for"
              ${f.diagnosed ? "" : `title="Available once the failure is diagnosed"`}>
              <button type="button" data-audience="engineer" aria-pressed="${state.audience === "engineer"}" ${f.diagnosed ? "" : "disabled"}>Engineer</button>
              <button type="button" data-audience="analyst" aria-pressed="${state.audience === "analyst"}" ${f.diagnosed ? "" : "disabled"}>Analyst</button>
            </span>
          </h3>
          ${diagnosis}
        </div>
        ${diff}
      </div>
      <div class="panel-foot">${prFooter(f)}</div>`;
    panel.querySelector(".panel-body").scrollTop = scroll;
  }

  function usageLine(u) {
    if (!u) return "";
    const n = (x) => Number(x || 0).toLocaleString();
    const cost = u.cost_usd == null ? "" : ` · $${Number(u.cost_usd).toFixed(4)}`;
    return `<div class="usage">Diagnosed by ${esc(u.model)} · ${n(u.input_tokens)} in / ${n(u.output_tokens)} out tokens${cost} · ${esc(u.seconds)}s</div>`;
  }

  // Why the PR button is disabled, or null when it can be used. Mirrors pr_blocker() in
  // agent/main.py, which enforces the same rules server-side.
  function prBlocker(f) {
    if (f.diagnosing) return "Diagnosis in progress";
    if (!f.diagnosed) return "Needs a diagnosis first";
    if (!f.patch) return "No code change suggested";
    if (f.confidence !== "High") return "Only High-confidence fixes can open a PR";
    if (f.patchError) return "Patch doesn't apply to the current code";
    if (!CFG || !CFG.prRepo) return "Set GITHUB_REPO on the agent to enable PRs";
    return null;
  }

  function prFooter(f) {
    const done = state.prResults[f.id];
    if (done) {
      const safe = /^https:\/\/github\.com\//.test(done.url || "");
      return `<span class="pr-done">PR #${esc(done.number)} opened · awaiting review</span>
        ${safe ? `<a href="${esc(done.url)}" target="_blank" rel="noopener">View on GitHub ↗</a>` : ""}`;
    }
    const why = prBlocker(f);
    return `<span class="why">${esc(why || "Opens a PR for review — nothing merges automatically.")}</span>
      <button class="btn primary" type="button" data-action="raise-pr" ${why ? "disabled" : ""}>Raise PR</button>`;
  }

  // ------------------------------------------------------------------ PR modal
  function openModal(f) {
    const modal = $("modal");
    modal.innerHTML = `
      <h2 id="modal-title">Open a pull request?</h2>
      <p>The agent will branch from <span class="mono">main</span>, apply the suggested change, push, and open a PR. It will not merge anything.</p>
      <dl>
        <dt>Repository</dt><dd>${esc(CFG.prRepo)}</dd>
        <dt>Branch</dt><dd>${esc(f.prBranch)}</dd>
        <dt>File</dt><dd>${esc(f.fixFile)}</dd>
        <dt>Title</dt><dd>${esc(f.prTitle)}</dd>
      </dl>
      <div class="error" id="modal-error" hidden></div>
      <div class="actions">
        <button class="btn" type="button" data-action="cancel">Cancel</button>
        <button class="btn primary" type="button" data-action="approve">Approve &amp; open PR</button>
      </div>`;
    $("modal-bg").classList.add("show");
    modal.querySelector('[data-action="cancel"]').focus();

    modal.onclick = async (e) => {
      const action = e.target.closest("button")?.dataset.action;
      if (action === "cancel") return closeModal();
      if (action !== "approve") return;
      const btn = e.target.closest("button");
      btn.disabled = true;
      btn.textContent = "Opening…";
      try {
        state.prResults[f.id] = await openPullRequest(f);
        closeModal();
        renderPanel();
      } catch (err) {
        const box = $("modal-error");
        box.hidden = false;
        box.textContent = err.message;
        btn.disabled = false;
        btn.textContent = "Try again";
      }
    };
  }
  function closeModal() { $("modal-bg").classList.remove("show"); }

  // ------------------------------------------------------------------ events
  function select(id) {
    state.selectedId = state.selectedId === id ? null : id;
    renderTable();
    renderPanel();
  }

  $("rows").addEventListener("click", (e) => {
    const tr = e.target.closest("tr[data-id]");
    if (tr) select(tr.dataset.id);
  });
  $("rows").addEventListener("keydown", (e) => {
    const tr = e.target.closest("tr[data-id]");
    if (!tr) return;
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(tr.dataset.id); }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      (e.key === "ArrowDown" ? tr.nextElementSibling : tr.previousElementSibling)?.focus();
    }
  });

  $("panel").addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    if (btn.dataset.action === "close") { state.selectedId = null; renderTable(); renderPanel(); }
    if (btn.dataset.audience) {
      state.audience = btn.dataset.audience;
      store.set("triage.audience", state.audience);
      renderPanel();
    }
    if (btn.dataset.action === "raise-pr") {
      const f = state.failures.find((x) => x.id === state.selectedId);
      if (f && !prBlocker(f)) openModal(f);
    }
  });

  document.querySelectorAll("th button[data-sort]").forEach((b) => b.addEventListener("click", () => {
    const key = b.dataset.sort;
    state.sort = state.sort.key === key ? { key, dir: -state.sort.dir } : { key, dir: key === "dag" ? 1 : -1 };
    renderTable();
  }));

  $("q").addEventListener("input", renderTable);
  $("cat").addEventListener("change", renderTable);
  $("refresh").addEventListener("click", load);
  ["start", "end"].forEach((id) => $(id).addEventListener("change", () => {
    if ($("end").value < $("start").value) $(id === "start" ? "end" : "start").value = $(id).value;
    load();
  }));

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if ($("modal-bg").classList.contains("show")) closeModal();
    else if (state.selectedId) { state.selectedId = null; renderTable(); renderPanel(); }
  });
  $("modal-bg").addEventListener("click", (e) => { if (e.target === $("modal-bg")) closeModal(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });

  // ------------------------------------------------------------------ boot
  $("start").value = $("end").value = today();
  $("end").max = today();
  $("subtitle").textContent = CFG ? `Airflow · ${CFG.env} · times in ${tzAbbr}` : "Airflow";
  load();
  setInterval(() => { if (!document.hidden) load(); }, POLL_MS);
})();
</script>
</body>
</html>
